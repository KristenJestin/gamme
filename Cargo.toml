[package]
name = "gamme"
version = "0.1.0"
edition = "2024"
# The code needs 1.88 (let chains); the pin is what CI builds with (.github/workflows/ci.yml).
rust-version = "1.95"
description = "Learn the piano: the score at the centre, falling notes as a help that fades with mastery"
license = "AGPL-3.0-only"
repository = "https://github.com/KristenJestin/gamme"
readme = "README.md"
publish = false

[dependencies]
# Verovio gives its MIDI output in base64; already built for `verovio`.
base64 = "0.22.1"
# The built-in piano: a SoundFont synthesizer (`rustysynth`) on the default output (`cpal`).
cpal = "0.18.2"
gpui-design-system = { git = "https://github.com/KristenJestin/gpui-design-system", tag = "v0.1.0" }
gpui-kit = { version = "=0.8.0", default-features = false, features = ["assets", "gpui-fast"] }
# Already built for GPUI, which takes the window icon as one of its images, and the frames of
# GPUI's images (the score's pages); only the PNG decoder.
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2"
# The library reads what it imports: MIDI files (`midly`), MusicXML and MEI (`roxmltree`) and
# the zip of a compressed MusicXML (`zip`, inflate only). `midly` also reads the timeline the
# piano plays; already built for `verovio`, without its `rayon` default.
midly = { version = "0.5.3", default-features = false, features = ["alloc", "std"] }
# MIDI out to a piano with its own speakers, and the list of MIDI in ports (ALSA, which `cpal`
# needs already).
midir = "0.11.1"
roxmltree = "0.21"
rustysynth = "1.3.8"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Unpacks the small piano's `.7z`, BZip2-compressed (the other SoundFont's `.tar.xz` goes through
# the user's `tar`). Pure Rust.
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["bzip2", "util"] }
sha2 = "0.11.1"
# Engraves the score. Its C++ (`verovio-sys`) takes ~35 min to compile once: CI caches it
# (docs/releases.md). `verovio::Toolkit::new` unpacks its resources into a new temporary folder
# it never deletes, and nothing lets them be put elsewhere: `src/engraver.rs` drives the bridge
# (`verovio-sys`, the same build) itself, with the resources (`verovio-data`) in the cache folder.
# `verovio` stays for its MIDI reader; never call its `Toolkit::new`.
verovio = "0.3.6"
verovio-sys = "=0.3.6"
verovio-data = "=0.3.6"
cxx = "1.0"
# Rasterizes the engraved pages, at GPUI's own version and features: nothing more is built.
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
