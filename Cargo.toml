[package]
name = "gamme"
version = "0.1.0"
edition = "2024"
# The code needs 1.88 (let chains); the pin is what CI builds with (.github/workflows/ci.yml).
rust-version = "1.95"
description = "Learn the piano: the score at the centre, falling notes as a help that fades with mastery"
license = "AGPL-3.0-only"
repository = "https://github.com/KristenJestin/gamme"
readme = "README.md"
publish = false

[dependencies]
gpui-design-system = { git = "https://github.com/KristenJestin/gpui-design-system", tag = "v0.1.0" }
gpui-kit = { version = "=0.8.0", default-features = false, features = ["assets", "gpui-fast"] }
# Already built for GPUI, which takes the window icon as one of its images; only the PNG decoder.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# The library reads what it imports: MIDI files (`midly`), MusicXML and MEI (`roxmltree`) and
# the zip of a compressed MusicXML (`zip`, inflate only).
midly = { version = "0.5", default-features = false, features = ["alloc", "std"] }
roxmltree = "0.21"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# Engraves the score. Its C++ (`verovio-sys`) takes ~35 min to compile once: CI caches it
# (docs/releases.md). Not called yet: a dependency, its C++ is built all the same, so the cache
# and the system packages are settled before the score screen needs it. (`Toolkit::new` unpacks
# its resources into a new temporary folder it never deletes: never call it per launch.)
verovio = "0.3.6"
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
